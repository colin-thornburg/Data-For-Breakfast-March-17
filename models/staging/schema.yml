version: 2

models:
  - name: stg_march_madness__games
    description: Staging model for March Madness game results with standardized types and matchup-level derived fields.
    columns:
      - name: game_id
        description: Surrogate key for a game built from tournament year, round, winning team, and losing team.
        data_tests:
          - not_null
          - unique
      - name: year
        description: Tournament year cast to an integer.
      - name: round_of
        description: Number of teams remaining in the tournament round, cast to an integer.
      - name: round_name
        description: Human-readable tournament round name derived from round_of.
      - name: winning_team_name
        description: Name of the team that won the game.
      - name: winning_team_seed
        description: Tournament seed for the winning team.
      - name: winning_team_score
        description: Final score for the winning team.
      - name: losing_team_name
        description: Name of the team that lost the game.
      - name: losing_team_seed
        description: Tournament seed for the losing team.
      - name: losing_team_score
        description: Final score for the losing team.
      - name: point_differential
        description: Margin of victory calculated as winning_team_score minus losing_team_score.
      - name: is_upset
        description: True when the losing team had a better seed number than the winning team.
      - name: seed_differential
        description: Difference between losing_team_seed and winning_team_seed.
